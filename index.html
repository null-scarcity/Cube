<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔方训练营，测测你是谁</title>
    <style>
        :root {
            --bg-color: #f4f1eb; 
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-light: #777777;
            --primary-blue: #1A2B4C; 
            --accent-orange: #1b4869; 
        }
        
        body {
            margin: 0; padding: 0; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }


        .container {
            width: 100%; max-width: 460px; margin: 25px; padding: 45px 35px; box-sizing: border-box;
            background: var(--card-bg); border-radius: 14px;
            box-shadow: 0 12px 45px rgba(0, 0, 0, 0.08); text-align: center; position: relative;
            animation: fadeIn 0.6s ease-out;
        }

        .hidden { display: none !important; }
        
        h1 { color: var(--primary-blue); font-size: 26px; font-weight: 800; letter-spacing: 1px; margin-bottom: 12px; }
        p { line-height: 1.7; color: var(--text-light); font-size: 14px; margin-bottom: 35px; }

 
        .cover-wrapper {
            position: relative; 
            width: 100%; 
            border-radius: 8px; 
            overflow: hidden; 
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            
            
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .cover-img { 
            width: 100%; 
            display: block; 
            object-fit: cover; 
            aspect-ratio: 4/3; 
        }
        
        .cube-wrapper { 
            
            position: absolute; 
            z-index: 10;
            perspective: 1000px; 
            
            
            width: 36px; 
            height: 36px; 
            
            
            transform: translateY(60px); 
        }
        
        /* .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: spin 8s infinite linear; }
        
        .face { 
            position: absolute; 
            
            width: 36px; 
            height: 36px; 
            border: 1.5px solid rgba(255, 255, 255, 0.9); 
            background: rgba(255, 255, 255, 0.464); 
            backdrop-filter: blur(2px); 
            -webkit-backdrop-filter: blur(2px);
        }
        
        
        .front  { transform: translateZ(18px); } 
        .back   { transform: rotateY(180deg) translateZ(18px); }
        .right  { transform: rotateY(90deg) translateZ(18px); } 
        .left   { transform: rotateY(-90deg) translateZ(18px); }
        .top    { transform: rotateX(90deg) translateZ(18px); } 
        .bottom { transform: rotateX(-90deg) translateZ(18px); } */

        
        .btn, .option-btn {
            display: block; width: 100%; padding: 16px 22px; margin: 14px 0;
            background: #f8f9fa; color: var(--text-main); border: 1px solid #e0e0e0; border-radius: 8px;
            font-size: 14px; cursor: pointer; transition: all 0.2s ease; line-height: 1.6;
        }
        .option-btn { text-align: left; }
        .btn:hover, .option-btn:hover { background: var(--primary-blue); color: #fff; border-color: var(--primary-blue); transform: translateY(-2px); }
        .btn-primary { background: var(--primary-blue); color: #fff; font-weight: bold; border: none; text-align: center; font-size: 15px; }
        .btn-primary:hover { background: #111d33; box-shadow: 0 6px 20px rgba(26, 43, 76, 0.3); }
        
        
        .btn-back {
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
            width: auto; margin: 25px auto 0 auto; padding: 8px 20px;
            background: transparent; color: var(--text-light); border: 1px dashed #cccccc; border-radius: 20px;
            font-size: 13px; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-back:hover { background: #fff; color: var(--accent-orange); border-color: var(--accent-orange); transform: translateY(-1px); }

        .progress-bar { width: 100%; height: 6px; background: #eee; border-radius: 3px; margin-bottom: 25px; overflow: hidden; }
        .progress { height: 100%; background: var(--accent-orange); width: 0%; border-radius: 3px; transition: width 0.4s ease; }
        
        
        .quiz-meta {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 13px; margin-bottom: 18px; font-weight: bold;
        }
        .quiz-count { color: var(--accent-orange); letter-spacing: 0.5px; }
        
        
        .quiz-stage { 
            padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold;
            transition: all 0.3s ease;
        }

        /* --- 结果展示区 --- */
        .result-box { margin-top: 10px; }
        .result-header { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .result-avatar { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-blue); background: #f0f4f8; }
        .result-title { font-size: 24px; font-weight: 900; color: var(--primary-blue); letter-spacing: 2px; margin: 0; }
        
        .result-img-frame { 
            background: var(--primary-blue); padding: 12px; border-radius: 4px; position: relative; margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15); display: flex; gap: 12px; align-items: stretch;
        }
        .result-main-img { flex: 1; width: 0; border-radius: 2px; object-fit: cover; display: block; aspect-ratio: 4/3; }
        .right-name-bar { width: 35px; display: flex; flex-direction: column; align-items: center; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 8px; }
        .vertical-name { writing-mode: vertical-rl; font-size: 20px; font-weight: 900; color: #e0f0ff; letter-spacing: 8px; margin-top: 10px; }
        .star-deco { margin-top: auto; margin-bottom: 10px; color: rgba(255, 255, 255, 0.5); font-size: 14px; text-align: center; }
        
        .result-desc { font-size: 14px; text-align: justify; line-height: 1.8; color: var(--text-main); background: #fafafa; padding: 20px; border-radius: 8px; border-left: 4px solid var(--accent-orange); margin-bottom: 25px; }

        
        .social-bonds { display: flex; gap: 12px; justify-content: space-between; margin-top: 10px; }
        .bond-card { flex: 1; background: #fdfdfb; border: 1px solid #e6e1da; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .bond-tag { font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-bottom: 8px; }
        .tag-mirror { background: #e1e7f0; color: var(--primary-blue); }
        .tag-partner { background: #fceddb; color: #b55d1a; }
        .bond-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; margin-bottom: 6px; border: 1px solid #ddd; background: #eee; }
        .bond-name { font-size: 14px; font-weight: bold; color: var(--text-main); margin-bottom: 2px; }
        .bond-match { font-size: 11px; color: var(--text-light); font-weight: 500; }

        @keyframes spin { 0% { transform: rotateX(0) rotateY(0); } 100% { transform: rotateX(360deg) rotateY(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
    window.MathJax = {
        tex: {
            inlineMath: [['$', '$']],
            displayMath: [['$$', '$$']]
        },
        chtml: {
            displayAlign: 'left'
        }
    };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>

<div class="container">
    <div id="home-page">
        <div class="cover-wrapper">
            <img src="./images/cover.jpg" alt="封面图" class="cover-img">
            <div class="cube-wrapper">
                <div class="cube">
                    <div class="face front"></div><div class="face back"></div>
                    <div class="face right"></div><div class="face left"></div>
                    <div class="face top"></div><div class="face bottom"></div>
                </div>
            </div>
        </div>
        <h1>魔方训练营</h1>
        <p>从地下城禁闭逃杀，到游戏策划各展其才<br>在充满背叛、结盟与算计的实境博弈中<br>如果你身处其中，将会如何操作？</p>
        <button class="btn btn-primary" onclick="startGame()">开始测试</button>
    </div>

    <div id="quiz-page" class="hidden">
        <div class="progress-bar"><div id="progress" class="progress"></div></div>
        
        <div class="quiz-meta">
            <span id="quiz-count" class="quiz-count">Q1 / 18</span>
            <span id="quiz-stage" class="quiz-stage">关卡</span>
        </div>
        
        <div id="question-text" style="font-size: 16px; font-weight: bold; margin-bottom: 25px; text-align: left; line-height: 1.6;"></div>
        <div id="options-container"></div>
        
        <div>
            <button id="back-button" class="btn-back" style="display: none;" onclick="prevQuestion()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                返回上一题
            </button>
        </div>
    </div>

    <div id="result-page" class="hidden">
        <div style="font-size: 13px; color: var(--text-light); margin-bottom: 15px; letter-spacing: 1px;">- 你的游戏身份 -</div>
        <div class="result-box">
            <div class="result-header">
                <img id="char-avatar" src="" alt="头像" class="result-avatar">
                <div id="char-title" class="result-title">加载中...</div>
            </div>
            
            <div class="result-img-frame">
                <img id="char-img" src="" alt="角色图" class="result-main-img">
                <div class="right-name-bar">
                    <div id="side-char-name" class="vertical-name">加载中</div>
                    <div class="star-deco">✦<br>✦<br>✦</div>
                </div>
            </div>
            
            <div id="char-desc" class="result-desc"></div>
            
            <div style="font-size: 13px; color: var(--text-light); margin: 25px 0 10px 0; letter-spacing: 1px; text-align: left; font-weight: bold;">- 与你相关 -</div>
            <div class="social-bonds">
                <div class="bond-card">
                    <span class="bond-tag tag-mirror">与你同面</span>
                    <img id="mirror-avatar" src="" class="bond-avatar" alt="镜像">
                    <div id="mirror-name" class="bond-name">-</div>
                    <div id="mirror-rate" class="bond-match">-</div>
                </div>
                <div class="bond-card">
                    <span class="bond-tag tag-partner">你的邻面</span>
                    <img id="partner-avatar" src="" class="bond-avatar" alt="搭子">
                    <div id="partner-name" class="bond-name">-</div>
                    <div id="partner-rate" class="bond-match">-</div>
                </div>
            </div>
        </div>
        <button onclick="openReadmeModal()" style="position: fixed; right: 20px; bottom: 20px; background: transparent; color: #06434e; border: 1px solid #06434e; padding: 8px 16px; border-radius: 4px; cursor: pointer; z-index: 999;">
            📊 README
        </button>
        <button class="btn btn-primary" style="margin-top:35px;" onclick="location.reload()">重新测试</button>
        <div style="margin-top: 30px; border-top: 1px dashed #e6e1da; padding-top: 20px;">
            <p style="font-size: 14px; font-weight: bold; color: #333; margin-bottom: 5px; text-align: left;">📬 意见与反馈</p>
            <p style="font-size: 12px; color: #8c8275; margin-bottom: 12px; text-align: left;">测试不准，功能不完善，有更好的题目想加进测试？欢迎来提出建议！（有题目提出可以附上署名哦，我会听取并@感谢你的~）</p>
    
            <form action="https://formbold.com/s/9xm1j" method="POST" id="feedback-form">
        
                <textarea 
                    name="feedback_content" 
                    rows="3" 
                    placeholder="输入你的建议..." 
                    required
                    style="width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #e6e1da; border-radius: 6px; font-size: 13px; background: #faf9f6; color: #333; resize: none; margin-bottom: 10px; outline: none;"
                ></textarea>
        
                <button 
                    type="submit" 
                    class="btn" 
                    style="width: 100%; font-size: 13px; background: transparent; color: var(--accent-orange, #e67e22); border: 1px solid var(--accent-orange, #e67e22); cursor: pointer;"
                >
                    ✦ 发送
                </button>
            </form>
        </div>
    </div>
    

    <div id="readmeModal" class="modal-overlay" onclick="closeReadmeModalOutside(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="margin:0; font-size:18px; color:#06434e;">🧭 README</h2>
                <button class="modal-close-btn" onclick="closeReadmeModal()">&times;</button>
            </div>
            <div class="modal-body" id="readme-target">
                <p style="color: #000000; text-align: center;">正在从GitHub远程加载...</p>
            </div>
        </div>
    </div>

    <style>
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.85); backdrop-filter: blur(5px); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: #ffffff; border: 1px solid #000000; width: 90%; max-width: 650px;
            max-height: 80vh; border-radius: 12px; display: flex; flex-direction: column;
            animation: modalFadeIn 0.3s ease;
        }
        @keyframes modalFadeIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header { padding: 20px 25px; border-bottom: 1px solid #000000; display: flex; justify-content: space-between; align-items: center; }
        .modal-close-btn { background: transparent; border: none; color: #000000; font-size: 28px; cursor: pointer; line-height: 1; }
        .modal-close-btn:hover { color: #ff3366; }
        .modal-body { padding: 25px; overflow-y: auto; font-size: 15px; line-height: 1.6; color: rgb(0, 0, 0); text-align: left; }
        .modal-body h2, .modal-body h3 { color: #000000; border-left: 3px solid #000000; padding-left: 10px; margin-top: 25px; }
        .modal-body ul { padding-left: 20px; }
        .modal-body strong { color: #000000; }
    </style>
</div>

<script>
    const defaultScores = { Trust: 5.0, Emotion: 5.0, Morality: 5.0, Decision: 5.0, Social: 5.0, Risk: 5.0, Info: 5.0, Value: 5.0 };
    let userScores = { ...defaultScores };
    let currentQuestionIndex = 0;
    let scoreHistory = [];

    
    const stageColors = {
        "禁闭逃杀": { bg: "#eef2f7", text: "#1b5c8a" },
        "妙手之争": { bg: "#fdf2f2", text: "#a94442" },
        "冰与火之舞": { bg: "#f2f9f9", text: "#31708f" },
        "星际之战": { bg: "#f5f0f9", text: "#684399" },
        "竞宝风云": { bg: "#fcf8e3", text: "#8a6d3b" },
        "王牌的诞生": { bg: "#fbf2f6", text: "#b93a74" },
        "收官": { bg: "#f1f3f5", text: "#495057" }
    };

    const questions = [
        // 禁闭逃杀
        { stage: "禁闭逃杀", text: "开局被基因面板901的玩家打成残血，你会：", options: [
            { text: "A. 把牌子扔了不玩了。", scores: { Emotion: -1.5, Value: -1.0 } },
            { text: "B. 冷静下来，想想办法。", scores: { Emotion: 1.5, Decision: 0.5 } },
            { text: "C. 跟TA炸了，谁都别想好！", scores: { Emotion: -1.0, Value: -1.0, Morality: -0.5 } }
        ]},
        { stage: "禁闭逃杀", text: "第一轮行动阶段，你更偏向于去哪个地方：", options: [
            { text: "A. 去垃圾场、大仓库抽卡赌运气。", scores: { Decision: -0.5, Risk: 1.0 } },
            { text: "B. 去粮仓水塔囤资源。", scores: { Risk: -1.5, Decision: 0.5 } },
            { text: "C. 去金库拿金条。", scores: { Risk: -1.0, Decision: 0.5 } }
        ]},
        { stage: "禁闭逃杀", text: "自由阶段，有玩家过来找你说“借我把刀，后期我去水仓的话给你个水”，你会：", options: [
            { text: "A. 那还说啥了，这刀借你。", scores: { Trust: 1.0, Social: 1.5 } },
            { text: "B. 这不是“画饼”吗，不借！", scores: { Trust: -1.0, Social: -0.5 } },
            { text: "C. 一般我才是说这种话的人。", scores: { Morality: -1.0, Info: 1.0 } }
        ]},
        // 妙手之争
        { stage: "妙手之争", text: "游戏前期，周围大部分玩家找到了所属阵营，但你由于信息有限尚未得知，此时有玩家愿意告诉你所有信息，条件是一个金币，你会：", options: [
            { text: "A. 跟TA交易。", scores: { Trust: 1.0, Social: 1.0 } },
            { text: "B. 队友自然会找到，没必要给TA。", scores: { Decision: 1.0, Social: -0.2 } },
            { text: "C. TA的信息不一定真，不给TA。", scores: { Trust: -1.0, Social: -0.2 } }
        ]},
        { stage: "妙手之争", text: "看诊阶段你刚好可以判断出自己阵营的皇子状态，而与你不同队的玩家未判断出来，此时你会：", options: [
            { text: "A. 告诉TA，劝说一起得治疗分。", scores: { Morality: 1.0, Social: 1.0 } },
            { text: "B. 隐瞒事实，编造谎言引导TA的行动使皇子健康。", scores: { Morality: -1.0, Info: 1.0 } },
            { text: "C. “给我两个金币，我告诉你信息。”", scores: { Value: 1.0, Info: 0.5 } }
        ]},
        { stage: "妙手之争", text: "最终治疗阶段，针灸大皇子可以稳定得治疗分，但针灸自己阵营的皇子（二皇子）有一定几率使皇子超级健康，此时你会：", options: [
            { text: "A. 稳一点，针灸大皇子。", scores: { Risk: -1.0 } },
            { text: "B. 赌一把，针灸二皇子。", scores: { Risk: 1.0 } },
            { text: "C. 针灸三皇子捣乱。", scores: { Value: -0.5, Morality: -0.5 } }
        ]},
        // 冰与火之舞
        { stage: "冰与火之舞", text: "战斗阶段，在需要赢得胜利的一场战争中，作为下属国的你被上级几乎耗光战力，你会：", options: [
            { text: "A. 故意摇0输掉这局。", scores: { Emotion: -1.0, Value: -1.0, Morality: -1.0 } },
            { text: "B. 人为刀俎我为鱼肉，笑一笑算了。", scores: { Emotion: 0.5, Morality: 0.5 } },
            { text: "C. 算一下还有没有翻盘的可能。", scores: { Emotion: 1.0 } }
        ]},
        { stage: "冰与火之舞", text: "被耗光战力的你碰上了战力富庶的国家，对方打算发起战斗而你手上并无拒绝卡，此时你会：", options: [
            { text: "A. 卖惨，劝说TA不要战斗。", scores: { Info: 1.0, Morality: 0.5 } },
            { text: "B. 引诱TA向别的国家发起战斗。", scores: { Risk: 0.2, Info: 1.0 } },
            { text: "C. 假装自己手里有拒绝卡，跟TA博弈。", scores: { Risk: 1.0, Morality: -0.3 } }
        ]},
        { stage: "冰与火之舞", text: "你的同盟国请求你帮忙代购卡牌，你会：", options: [
            { text: "A. 既然是同盟国，原价买卖，做个人情。", scores: { Morality: 0.5, Social: 1.0 } },
            { text: "B. 告知TA原价，但趁火打劫，多索要一点金币。", scores: { Morality: 0.5, Info: 0.5, Value: 0.5 } },
            { text: "C. 谎报价格，多获取点金币。", scores: { Morality: -0.5 } }
        ]},
        // 星际之战
        { stage: "星际之战", text: "自由阶段，场上开始组建多人大联盟，追求共享信息，你会想：", options: [
            { text: "A. 积极响应，并充当联盟的主体，力求联盟不散架。", scores: { Social: 1.0, Info: 0.5 } },
            { text: "B. 表面处于联盟之中，但随时准备在联盟利益冲突时倒戈，谋求利益。", scores: { Social: -0.5 } },
            { text: "C. 不加入，找一两个信得过的人一同制定对策。", scores: { Trust: -0.5, Social: -1.0 } }
        ]},
        { stage: "星际之战", text: "行动阶段，你还剩最后一格没走，这时场上与你同分的玩家告诉你这里有TA埋的雷，你会：", options: [
            { text: "A. 相信TA，不走了。", scores: { Trust: 1.0, Risk: -1.0 } },
            { text: "B. 不信，哪有这么巧的事，继续走。", scores: { Trust: -1.0, Risk: 1.0,Value:1.0 } },
            { text: "C. 不信TA，但是保险起见，还是不走了。", scores: { Trust: -1.0, Risk: -1.0 } }
        ]},
        // 竞宝风云
        { stage: "竞宝风云", text: "竞拍阶段，面对一件不明觉厉的宝物，你会：", options: [
            { text: "A. 尽可能拍到它。", scores: { Decision: -1.0, Risk: 0.5 } },

    function startGame() {
        document.getElementById('home-page').classList.add('hidden');
        document.getElementById('quiz-page').classList.remove('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        const progress = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progress').style.width = progress + '%';
        
        const q = questions[currentQuestionIndex];
        
        // 渲染顶栏题号
        document.getElementById('quiz-count').innerText = `Q${currentQuestionIndex + 1} / ${questions.length}`;
        
        // 动态变更游戏Label
        const stageLabel = document.getElementById('quiz-stage');
        stageLabel.innerText = q.stage;
        if (stageColors[q.stage]) {
            stageLabel.style.backgroundColor = stageColors[q.stage].bg;
            stageLabel.style.color = stageColors[q.stage].text;
        }

        const backBtn = document.getElementById('back-button');
        backBtn.style.display = currentQuestionIndex === 0 ? 'none' : 'inline-block';
        
        document.getElementById('question-text').innerText = q.text;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = ''; 

        q.options.forEach((option, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option.text;
            btn.style.animation = `fadeIn 0.3s ease-out ${idx * 0.08}s backwards`;
            btn.onclick = () => selectOption(option.scores);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(scoresToAdd) {
        scoreHistory.push(JSON.parse(JSON.stringify(userScores)));
        for (let key in scoresToAdd) {
            if (userScores[key] !== undefined) {
                userScores[key] += scoresToAdd[key];
            }
        }
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            renderQuestion();
        } else {
            document.getElementById('progress').style.width = '100%';
            setTimeout(calculateResult, 300); 
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--; 
            userScores = scoreHistory.pop(); 
            renderQuestion(); 
        }
    }

    // 中心化余弦相似度算法
    function getCenteredCosineSimilarity(vecA, vecB) {
        const keys = ["Trust", "Emotion", "Morality", "Decision", "Social", "Risk", "Info", "Value"];
        
        
        let sumA = 0, sumB = 0;
        keys.forEach(k => { sumA += vecA[k]; sumB += vecB[k]; });
        const meanA = sumA / keys.length;
        const meanB = sumB / keys.length;

       
        let dotProduct = 0;
        let normA = 0;
        let normB = 0;

        keys.forEach(k => {
            let clrA = vecA[k] - meanA; 
            let clrB = vecB[k] - meanB;
            dotProduct += clrA * clrB;
            normA += clrA * clrA;
            normB += clrB * clrB;
        });

        if (normA === 0 || normB === 0) return -1.0; 
        return dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
    }

    function calculateResult() {
        
        for (let key in userScores) {
            if (userScores[key] > 9.0) userScores[key] = 9.0;
            if (userScores[key] < 1.0) userScores[key] = 1.0;
        }

        // ==========================================
        // 主选手匹配
        // ==========================================
        let bestMatch = null;
        let maxAdjustedSim = -Infinity;
        let allSims = []; // 存储所有选手的相似度

        characters.forEach(char => {
            
            const rawSim = getCenteredCosineSimilarity(userScores, char.scores);
            
           
            let factor = char.radius_factor || 1.0;
       
            let adjustedSim = rawSim * factor;

            allSims.push({ char, rawSim: rawSim, adjustedSim: adjustedSim });

            if (adjustedSim > maxAdjustedSim) {
                maxAdjustedSim = adjustedSim;
                bestMatch = char;
            }
        });

        // ==========================================
        // 寻找【你的镜像】
        // ==========================================
        let mirrorCandidates = allSims.filter(item => item.char.name !== bestMatch.name);
        mirrorCandidates.sort((a, b) => b.rawSim - a.rawSim);

        const mirrorMatch = mirrorCandidates[0].char;
        let mirrorSimPercentage = ((mirrorCandidates[0].rawSim + 1) * 50).toFixed(1);

        // ==========================================
        // 构建契合搭子
        // ==========================================
        const keys = ["Trust", "Emotion", "Morality", "Decision", "Social", "Risk", "Info", "Value"];
        
        let userSum = 0;
        keys.forEach(k => userSum += userScores[k]);
        const userMean = userSum / keys.length;

        
        let v_comp_theoretical = {};
        keys.forEach(k => { 
            v_comp_theoretical[k] = userScores[k] - userMean; 
        });
        v_comp_theoretical["Decision"] *= -1.0;
        v_comp_theoretical["Social"]   *= -1.0;
        v_comp_theoretical["Info"]     *= -1.0;

        let bestPartnerChar = null;
        let maxPartnerSim = -2.0;

        characters.forEach(char => {
            if (char.name === bestMatch.name) return; // 不能是自己

            let charSum = 0;
            keys.forEach(k => charSum += char.scores[k]);
            const charMean = charSum / keys.length;
            let v_char_centered = {};
            keys.forEach(k => { v_char_centered[k] = char.scores[k] - charMean; });

            let dotProduct = 0, normA = 0, normB = 0;
            keys.forEach(k => {
                dotProduct += v_comp_theoretical[k] * v_char_centered[k];
                normA += v_comp_theoretical[k] * v_comp_theoretical[k];
                normB += v_char_centered[k] * v_char_centered[k];
            });

            let simComp = (normA === 0 || normB === 0) ? -1.0 : dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
            if (simComp > maxPartnerSim) {
                maxPartnerSim = simComp;
                bestPartnerChar = char;
            }
        });

        if (!bestPartnerChar) bestPartnerChar = mirrorMatch;
        let partnerFitPercentage = ((maxPartnerSim + 1) * 50).toFixed(1);


        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('result-page').classList.remove('hidden');
        

        document.getElementById('char-avatar').src = bestMatch.avatar; 
        document.getElementById('char-img').src = bestMatch.image;     
        document.getElementById('char-title').innerText = bestMatch.title; 
        document.getElementById('side-char-name').innerText = bestMatch.name; 
        document.getElementById('char-desc').innerText = bestMatch.desc;


        document.getElementById('mirror-avatar').src = mirrorMatch.avatar;
        document.getElementById('mirror-name').innerText = mirrorMatch.name;
        document.getElementById('mirror-rate').innerText = `相似程度 ${mirrorSimPercentage}%`;


        document.getElementById('partner-avatar').src = bestPartnerChar.avatar;
        document.getElementById('partner-name').innerText = bestPartnerChar.name;
        document.getElementById('partner-rate').innerText = `契合指数 ${partnerFitPercentage}%`;
    }
    // 远程加载 README 的弹窗控制逻辑
    const modal = document.getElementById('readmeModal');
    const readmeTarget = document.getElementById('readme-target');
        

    const readmeUrl = "https://raw.githubusercontent.com/null-scarcity/Cube/refs/heads/master/readme.md"; 
    let isReadmeLoaded = false;
        function openReadmeModal() {
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        if (!isReadmeLoaded) {
            fetch(readmeUrl)
                .then(response => {
                    if (!response.ok) throw new Error("无法读取文件");
                    return response.text();
                })
                .then(markdownText => {
                    readmeTarget.innerHTML = marked.parse(markdownText);
                    isReadmeLoaded = true;

                    if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise([readmeTarget]).catch(err => console.log(err));
                    }
                })
                .catch(err => {
                    readmeTarget.innerHTML = `<p style="color: #ff3366; text-align:center;">加载失败<br><span style="font-size:12px; color:#888;">原因: ${err.message}</span></p>`;
                });
        }
    }

    function closeReadmeModal() {
        modal.style.display = 'none';
        document.body.style.overflow = '';
    }

    function closeReadmeModalOutside(event) {
        if (event.target === modal) closeReadmeModal();
    }
</script>
